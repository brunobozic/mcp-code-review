version: '3.8'

services:
  gitlab:
    image: gitlab/gitlab-ce:16.7.2-ce.0
    container_name: simple-gitlab
    hostname: gitlab.local
    ports:
      - '8080:80'
      - '2222:22'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8080'
        gitlab_rails['initial_root_password'] = 'SecureGitLabPass123!'
        gitlab_rails['store_initial_root_password'] = false
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['listen_address'] = '*'
        gitlab_rails['signup_enabled'] = false
        gitlab_rails['display_initial_root_password'] = false
        postgresql['shared_buffers'] = "256MB"
        redis['maxmemory'] = "256mb"
        
        # Enhanced Console Logging Configuration
        logging['svlogd_prefix'] = "gitlab"
        logging['udp_log_shipping_host'] = nil
        logging['udp_log_shipping_port'] = nil
        
        # Enable verbose logging for debugging
        gitlab_rails['log_level'] = 'info'
        nginx['error_log_level'] = "info"
        
        # Performance tuning for container - Use Puma instead of Unicorn
        puma['worker_processes'] = 2
        puma['worker_timeout'] = 120
        puma['min_threads'] = 1
        puma['max_threads'] = 16
        
        # Disable monitoring to reduce resource usage
        prometheus_monitoring['enable'] = false
        grafana['enable'] = false
        
        # Memory management for Puma
        puma['per_worker_max_memory_mb'] = 650
      GITLAB_ROOT_PASSWORD: 'SecureGitLabPass123!'
    volumes:
      - gitlab-data:/var/opt/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-config:/etc/gitlab
      - ./scripts/init-gitlab-root.sh:/tmp/init-gitlab-root.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck", "--fail"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

volumes:
  gitlab-data:
  gitlab-logs:
  gitlab-config: