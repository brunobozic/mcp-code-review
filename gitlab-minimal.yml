version: '3.8'

services:
  gitlab:
    image: gitlab/gitlab-ce:16.7.2-ce.0
    container_name: mcp-gitlab-fixed
    hostname: localhost
    restart: unless-stopped
    ports:
      - "9191:80"
      - "2222:22"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: 256m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:9191'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        
        # Critical: Use TCP port instead of Unix socket
        puma['enable'] = true  
        puma['worker_processes'] = 1
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        puma['worker_timeout'] = 60
        puma['port'] = 8080
        puma['bind'] = 'tcp://127.0.0.1:8080'
        
        # Nginx proxy to Puma TCP
        nginx['enable'] = true
        nginx['listen_port'] = 80
        nginx['proxy_set_headers'] = {
          "Host" => "$$http_host",
          "X-Real-IP" => "$$remote_addr",
          "X-Forwarded-For" => "$$proxy_add_x_forwarded_for",
          "X-Forwarded-Proto" => "$$scheme"
        }
        
        # Database minimal settings
        postgresql['enable'] = true
        postgresql['max_connections'] = 50
        postgresql['shared_buffers'] = "64MB"
        postgresql['work_mem'] = "2MB"
        
        # Redis minimal
        redis['enable'] = true
        redis['maxmemory'] = "64mb"
        
        # Disable all monitoring and extras
        prometheus_monitoring['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false
        gitlab_exporter['enable'] = false
        grafana['enable'] = false
        alertmanager['enable'] = false
        gitlab_kas['enable'] = false
        pages_nginx['enable'] = false
        mattermost['enable'] = false
        
        # Minimal Sidekiq
        sidekiq['max_concurrency'] = 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/-/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data: