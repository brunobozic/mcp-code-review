version: '3.8'

services:
  # PostgreSQL Database for GitLab
  postgresql:
    image: postgres:15-alpine
    container_name: gitlab-postgresql
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gitlab_production}
      POSTGRES_USER: ${POSTGRES_USER:-gitlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitlab_password}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitlab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for GitLab
  redis:
    image: redis:7-alpine
    container_name: gitlab-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GitLab CE
  gitlab:
    image: gitlab/gitlab-ce:17.7.0-ce.0
    container_name: gitlab-ce
    restart: unless-stopped
    hostname: localhost
    shm_size: 256m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # External URL configuration
        external_url '${GITLAB_EXTERNAL_URL:-http://localhost:9191}'
        
        # PostgreSQL configuration (external database)
        postgresql['enable'] = false
        gitlab_rails['db_adapter'] = 'postgresql'
        gitlab_rails['db_encoding'] = 'unicode'
        gitlab_rails['db_host'] = 'postgresql'
        gitlab_rails['db_port'] = 5432
        gitlab_rails['db_database'] = '${POSTGRES_DB:-gitlab_production}'
        gitlab_rails['db_username'] = '${POSTGRES_USER:-gitlab}'
        gitlab_rails['db_password'] = '${POSTGRES_PASSWORD:-gitlab_password}'
        gitlab_rails['db_pool'] = 10
        
        # Redis configuration (external cache)
        redis['enable'] = false
        gitlab_rails['redis_host'] = 'redis'
        gitlab_rails['redis_port'] = 6379
        gitlab_rails['redis_password'] = '${REDIS_PASSWORD:-redis_password}'
        gitlab_rails['redis_database'] = 0
        
        # Core GitLab settings
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD:-Adm1nP@ssw0rd2025!}'
        gitlab_rails['time_zone'] = 'UTC'
        
        # Puma web server configuration (production settings)
        puma['enable'] = true
        puma['worker_processes'] = 2
        puma['min_threads'] = 4
        puma['max_threads'] = 4
        puma['worker_timeout'] = 60
        puma['per_worker_max_memory_mb'] = 1024
        
        # Sidekiq background job processing
        sidekiq['enable'] = true
        sidekiq['max_concurrency'] = 10
        
        # Gitaly Git repository storage service (simplified)
        gitaly['enable'] = true
        
        # Security and monitoring settings
        gitlab_rails['monitoring_whitelist'] = ['127.0.0.1/32', '::1/128']
        gitlab_rails['webhook_timeout'] = 30
        gitlab_rails['webhook_count_limit'] = 100
        
        # Project and feature defaults
        gitlab_rails['gitlab_default_projects_features_issues'] = true
        gitlab_rails['gitlab_default_projects_features_merge_requests'] = true
        gitlab_rails['gitlab_default_projects_features_wiki'] = true
        gitlab_rails['gitlab_default_projects_features_snippets'] = true
        gitlab_rails['gitlab_default_projects_features_builds'] = true
        gitlab_rails['gitlab_default_projects_features_container_registry'] = false
        
        # Essential GitLab services only - no deprecated options
        # Note: Removed all deprecated service configurations for GitLab 17.7.0 compatibility
        
        # Basic security settings
        gitlab_rails['session_expire_delay'] = 10080
        
        # Essential performance settings
        gitlab_rails['artifacts_enabled'] = true
        gitlab_rails['backup_keep_time'] = 604800
    ports:
      - "${GITLAB_PORT:-9191}:80"
      - "2222:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'
    ulimits:
      sigpending: 62793
      nproc: 131072
      nofile: 60000
      core: 0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/-/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:0.4.22
    container_name: chromadb
    restart: always
    environment:
      CHROMA_HOST: ${CHROMADB_HOST:-0.0.0.0}
      CHROMA_PORT: ${CHROMADB_PORT:-19193}
    ports:
      - "${CHROMADB_PORT:-19193}:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgresql_data:
    driver: local
  redis_data:
    driver: local
  gitlab_config:
    driver: local
  gitlab_logs:
    driver: local
  gitlab_data:
    driver: local
  chromadb_data:
    driver: local

networks:
  default:
    driver: bridge
