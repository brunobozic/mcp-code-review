services:
  gitlab:
    image: gitlab/gitlab-ce:16.7.2-ce.0
    container_name: mcp-gitlab-minimal
    restart: unless-stopped
    ports:
      - "8080:80"
      - "2222:22"
    volumes:
      - ../data/gitlab/config:/etc/gitlab
      - ../data/gitlab/logs:/var/log/gitlab  
      - ../data/gitlab/data:/var/opt/gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8080'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        
        # Minimal Puma configuration for GitLab 16.x
        puma['worker_processes'] = 1
        puma['worker_timeout'] = 60
        
        # Critical: max request duration MUST be smaller than worker timeout
        gitlab_rails['max_request_duration_seconds'] = 50
        
        # Disable problematic features
        prometheus_monitoring['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false
        gitlab_exporter['enable'] = false
        grafana['enable'] = false
        
        # Minimal sidekiq
        sidekiq['max_concurrency'] = 5