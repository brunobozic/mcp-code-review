services:
  # Enterprise-Grade GitLab CE with All Professional Features
  gitlab:
    image: gitlab/gitlab-ce:16.7.2-ce.0
    restart: always
    hostname: 'gitlab.mcp-enterprise.local'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # Basic Configuration
        external_url 'http://localhost:9191'
        
        # Performance and Resource Settings
        puma['worker_timeout'] = 60
        puma['worker_processes'] = 4
        puma['min_threads'] = 4
        puma['max_threads'] = 16
        puma['worker_max_memory'] = 1000
        
        sidekiq['max_concurrency'] = 25
        sidekiq['min_concurrency'] = 10
        
        # PostgreSQL Optimization
        postgresql['shared_buffers'] = "512MB"
        postgresql['max_connections'] = 200
        postgresql['random_page_cost'] = 1.1
        postgresql['effective_cache_size'] = "1GB"
        postgresql['work_mem'] = "8MB"
        postgresql['maintenance_work_mem'] = "128MB"
        postgresql['checkpoint_completion_target'] = 0.9
        postgresql['wal_buffers'] = "16MB"
        postgresql['max_wal_size'] = "2GB"
        postgresql['min_wal_size'] = "256MB"
        postgresql['log_checkpoints'] = 'on'
        postgresql['log_lock_waits'] = 'on'
        postgresql['log_min_duration_statement'] = 1000
        postgresql['track_activity_query_size'] = 2048
        postgresql['autovacuum'] = 'on'
        postgresql['autovacuum_max_workers'] = 3
        postgresql['autovacuum_vacuum_scale_factor'] = 0.1
        postgresql['autovacuum_analyze_scale_factor'] = 0.05
        
        # Redis Optimization  
        redis['maxmemory'] = "512mb"
        redis['maxmemory_policy'] = "allkeys-lru"
        redis['save'] = "900 1 300 10 60 10000"
        redis['tcp_keepalive'] = 300
        redis['tcp_backlog'] = 511
        
        # GitLab Application Settings
        gitlab_rails['time_zone'] = 'UTC'
        gitlab_rails['backup_keep_time'] = 604800
        gitlab_rails['backup_path'] = "/var/opt/gitlab/backups"
        gitlab_rails['backup_archive_permissions'] = 0644
        gitlab_rails['gitlab_email_enabled'] = true
        gitlab_rails['gitlab_email_from'] = 'gitlab-noreply@mcp-enterprise.local'
        gitlab_rails['gitlab_email_display_name'] = 'GitLab MCP Enterprise'
        gitlab_rails['gitlab_email_reply_to'] = 'noreply@mcp-enterprise.local'
        gitlab_rails['gitlab_default_projects_limit'] = 100
        gitlab_rails['gitlab_default_can_create_group'] = true
        gitlab_rails['gitlab_username_changing_enabled'] = false
        gitlab_rails['gitlab_default_theme'] = 2
        gitlab_rails['gravatar_enabled'] = true
        gitlab_rails['gitlab_signup_enabled'] = false
        gitlab_rails['gitlab_signin_enabled'] = true
        gitlab_rails['issue_closing_pattern'] = '\\b(?:closed?|closes?|closing|close|fixed?|fixes?|fixing|fix|resolved?|resolves?|resolving|resolve|implemented?|implements?|implementing|implement)\\b'
        
        # Security and Authentication
        gitlab_rails['initial_root_password'] = 'Adm1nP@ssw0rd2025!'
        gitlab_rails['store_initial_root_password'] = true
        gitlab_rails['display_initial_root_password'] = true
        gitlab_rails['password_authentication_enabled_for_web'] = true
        gitlab_rails['password_authentication_enabled_for_git'] = true
        
        # Session and CSRF Protection
        gitlab_rails['session_expire_delay'] = 10080
        gitlab_rails['session_store_timeout'] = 30
        gitlab_rails['csrf_token_expiry_seconds'] = 3600
        
        # Rate Limiting
        gitlab_rails['rate_limit_requests_per_period'] = 10
        gitlab_rails['rate_limit_period'] = 60
        
        # Git Configuration
        gitlab_shell['auth_file'] = "/var/opt/gitlab/.ssh/authorized_keys"
        gitlab_shell['ssh_port'] = 2222
        gitlab_shell['git_timeout'] = 800
        gitlab_shell['log_level'] = 'INFO'
        
        # Gitaly Configuration for Git Operations
        gitaly['configuration'] = {
          storage: [
            {
              name: 'default',
              path: '/var/opt/gitlab/git-data/repositories'
            }
          ],
          logging: {
            level: 'info',
            format: 'json'
          },
          git: {
            catfile_cache_size: 100,
            use_bundled_git: true
          },
          prometheus: {
            grpc_latency_buckets: '[0.001, 0.005, 0.025, 0.1, 0.5, 1.0, 10.0, 30.0, 60.0, 300.0, 1500.0]'
          }
        }
        
        # GitLab Workhorse
        gitlab_workhorse['listen_network'] = "unix"
        gitlab_workhorse['listen_addr'] = "/var/opt/gitlab/gitlab-workhorse/socket"
        gitlab_workhorse['auth_backend'] = "http://localhost:8080"
        gitlab_workhorse['auth_socket'] = "/var/opt/gitlab/gitlab-rails/sockets/gitlab.socket"
        gitlab_workhorse['proxy_headers_timeout'] = "5m0s"
        gitlab_workhorse['api_limit'] = 0
        gitlab_workhorse['api_queue_limit'] = 0
        gitlab_workhorse['api_queue_duration'] = "30s"
        
        # Nginx Web Server Configuration
        nginx['enable'] = true
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['redirect_http_to_https'] = false
        nginx['ssl_certificate'] = "/etc/gitlab/ssl/gitlab.crt"
        nginx['ssl_certificate_key'] = "/etc/gitlab/ssl/gitlab.key"
        nginx['ssl_ciphers'] = "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA256:AES128-SHA256:AES256-SHA:AES128-SHA"
        nginx['ssl_prefer_server_ciphers'] = "on"
        nginx['ssl_protocols'] = "TLSv1.2 TLSv1.3"
        nginx['ssl_session_cache'] = "builtin:1000 shared:SSL:10m"
        nginx['ssl_session_timeout'] = "5m"
        nginx['client_max_body_size'] = '250m'
        nginx['gzip_enabled'] = true
        nginx['gzip_comp_level'] = 6
        nginx['gzip_http_version'] = '1.1'
        nginx['gzip_vary'] = 'on'
        nginx['gzip_disable'] = '"msie6"'
        nginx['gzip_min_length'] = 250
        nginx['gzip_types'] = [ "text/plain", "text/css", "application/x-javascript", "text/xml", "text/javascript", "application/javascript", "application/json" ]
        nginx['keepalive_timeout'] = 65
        nginx['cache_max_size'] = '5000m'
        
        # Monitoring and Metrics (Prometheus)
        prometheus['enable'] = true
        prometheus['listen_address'] = 'localhost:9090'
        prometheus['scrape_interval'] = 15
        prometheus['scrape_timeout'] = 15
        prometheus['external_labels'] = {
          'environment' => 'development',
          'gitlab_instance' => 'mcp-enterprise'
        }
        
        node_exporter['enable'] = true
        node_exporter['listen_address'] = 'localhost:9100'
        
        redis_exporter['enable'] = true
        redis_exporter['listen_address'] = 'localhost:9121'
        
        postgres_exporter['enable'] = true
        postgres_exporter['listen_address'] = 'localhost:9187'
        
        gitlab_exporter['enable'] = true
        gitlab_exporter['listen_address'] = 'localhost:9168'
        
        gitaly['prometheus_listen_addr'] = "localhost:9236"
        
        # Grafana Dashboard
        grafana['enable'] = true
        grafana['admin_password'] = 'GrafanaEnterpriseAdmin2025!'
        grafana['disable_login_form'] = false
        grafana['allow_user_sign_up'] = false
        grafana['auto_assign_org'] = true
        grafana['auto_assign_org_role'] = 'Viewer'
        grafana['env'] = {
          'GF_SECURITY_ADMIN_PASSWORD' => 'GrafanaEnterpriseAdmin2025!',
          'GF_USERS_ALLOW_SIGN_UP' => 'false',
          'GF_USERS_ALLOW_ORG_CREATE' => 'false',
          'GF_ANALYTICS_REPORTING_ENABLED' => 'false',
          'GF_ANALYTICS_CHECK_FOR_UPDATES' => 'false'
        }
        
        # GitLab Container Registry
        registry['enable'] = true
        registry['username'] = "registry"
        registry['group'] = "registry"
        registry['registry_http_addr'] = "localhost:5000"
        registry['debug_addr'] = "localhost:5001"
        registry['log_directory'] = "/var/log/gitlab/registry"
        registry['log_level'] = "info"
        registry['log_formatter'] = "text"
        registry['rootdirectory'] = "/var/opt/gitlab/gitlab-rails/shared/registry"
        registry['health_storagedriver_enabled'] = true
        registry['middleware'] = {
          'redirect' => [
            {
              'disable' => true
            }
          ]
        }
        gitlab_rails['registry_enabled'] = true
        gitlab_rails['registry_host'] = "localhost"
        gitlab_rails['registry_port'] = "5000"
        gitlab_rails['registry_api_url'] = "http://localhost:5000"
        gitlab_rails['registry_key_path'] = "/var/opt/gitlab/gitlab-rails/certificate.key"
        gitlab_rails['registry_path'] = "/var/opt/gitlab/gitlab-rails/shared/registry"
        gitlab_rails['registry_issuer'] = "gitlab-issuer"
        
        # GitLab Pages
        pages['enable'] = true
        pages['access_control'] = true
        pages['external_http'] = ['localhost:8080']
        pages['listen_proxy'] = "localhost:8090"
        pages['redirect_http'] = false
        gitlab_rails['pages_enabled'] = true
        gitlab_rails['pages_host'] = "localhost"
        gitlab_rails['pages_port'] = 8080
        gitlab_rails['pages_https'] = false
        
        # GitLab KAS (Kubernetes Agent Server)
        gitlab_kas['enable'] = true
        gitlab_kas['listen_address'] = '0.0.0.0:8150'
        gitlab_kas['listen_websocket'] = true
        gitlab_kas['listen_network'] = 'tcp'
        gitlab_kas['log_level'] = 'info'
        gitlab_rails['gitlab_kas_enabled'] = true
        gitlab_rails['gitlab_kas_external_url'] = 'ws://localhost:8150'
        gitlab_rails['gitlab_kas_internal_url'] = 'grpc://localhost:8153'
        
        # Backup Configuration
        gitlab_rails['manage_backup_path'] = true
        gitlab_rails['backup_gitaly_backup_path'] = "/opt/gitlab/embedded/bin/gitaly-backup"
        gitlab_rails['backup_upload_connection'] = nil
        gitlab_rails['backup_upload_remote_directory'] = nil
        gitlab_rails['backup_multipart_chunk_size'] = 104857600
        gitlab_rails['backup_encryption'] = nil
        
        # Cron Jobs for Maintenance
        gitlab_rails['cron_jobs'] = {
          'admin_email_worker' => {
            'cron' => '0 0 * * 0',
            'job_class' => 'AdminEmailWorker',
            'queue_name' => 'cronjob:admin_email'
          },
          'personal_access_tokens_expiring_worker' => {
            'cron' => '0 1 * * *',
            'job_class' => 'PersonalAccessTokens::ExpiringWorker',
            'queue_name' => 'cronjob:personal_access_tokens_expiring'
          },
          'repository_check_worker' => {
            'cron' => '20 * * * *',
            'job_class' => 'RepositoryCheck::BatchWorker',
            'queue_name' => 'cronjob:repository_check'
          },
          'stuck_ci_jobs_worker' => {
            'cron' => '0 * * * *',
            'job_class' => 'StuckCiJobsWorker',
            'queue_name' => 'cronjob:stuck_ci_jobs'
          },
          'pipeline_schedule_worker' => {
            'cron' => '19 * * * *',
            'job_class' => 'PipelineScheduleWorker',
            'queue_name' => 'cronjob:pipeline_schedule'
          },
          'expire_build_artifacts_worker' => {
            'cron' => '50 * * * *',
            'job_class' => 'ExpireBuildArtifactsWorker',
            'queue_name' => 'cronjob:expire_build_artifacts'
          },
          'repository_archive_cache_worker' => {
            'cron' => '0 * * * *',
            'job_class' => 'RepositoryArchiveCacheWorker',
            'queue_name' => 'cronjob:repository_archive_cache'
          },
          'import_export_project_cleanup_worker' => {
            'cron' => '0 * * * *',
            'job_class' => 'ImportExportProjectCleanupWorker',
            'queue_name' => 'cronjob:import_export_project_cleanup'
          }
        }
        
        # Logging Configuration
        logging['svlogd_size'] = 200 * 1024 * 1024
        logging['svlogd_num'] = 30
        logging['svlogd_timeout'] = 24 * 60 * 60
        logging['svlogd_filter'] = "gzip"
        logging['svlogd_udp'] = nil
        logging['svlogd_prefix'] = nil
        logging['logrotate_frequency'] = "daily"
        logging['logrotate_maxsize'] = nil
        logging['logrotate_size'] = nil
        logging['logrotate_rotate'] = 30
        logging['logrotate_compress'] = "compress"
        logging['logrotate_method'] = "copytruncate"
        logging['logrotate_postrotate'] = nil
        logging['logrotate_dateformat'] = nil
        
        # High Availability Settings (for future scaling)
        gitlab_rails['db_pool'] = 50
        gitlab_rails['redis_cache_instance'] = nil
        gitlab_rails['redis_cache_sentinels'] = nil
        gitlab_rails['redis_queues_instance'] = nil
        gitlab_rails['redis_queues_sentinels'] = nil
        gitlab_rails['redis_shared_state_instance'] = nil
        gitlab_rails['redis_shared_state_sentinels'] = nil
        
        # GitLab CI/CD Settings
        gitlab_ci['gitlab_ci_all_broken_builds'] = true
        gitlab_ci['gitlab_ci_add_pusher'] = true
        
        # Advanced Git Settings
        git_data_dirs({
          "default" => {
            "path" => "/var/opt/gitlab/git-data",
            "gitaly_address" => "unix:/var/opt/gitlab/gitaly/gitaly.socket"
          }
        })
        
        # External Dependencies (disabled for self-contained setup)
        mattermost['enable'] = false
        
        # Let's Encrypt (disabled for local development)
        letsencrypt['enable'] = false
        
        # Package Repository (disabled for local development) 
        # gitlab_rails['packages_enabled'] = true
        # gitlab_rails['dependency_proxy_enabled'] = true
        
    ports:
      - '9191:80'          # HTTP Web Interface
      - '2222:22'          # SSH Git Access
      - '5050:5000'        # Container Registry
      - '8080:8080'        # GitLab Pages
      - '8150:8150'        # GitLab KAS (Kubernetes Agent)
      - '9090:9090'        # Prometheus Metrics
      - '3000:3000'        # Grafana Dashboard
    volumes:
      - './gitlab-enterprise/config:/etc/gitlab'
      - './gitlab-enterprise/logs:/var/log/gitlab'
      - './gitlab-enterprise/data:/var/opt/gitlab'
      - './gitlab-enterprise/backups:/var/opt/gitlab/backups'
    shm_size: '512m'
    ulimits:
      sigpending: 62793
      nproc: 131072
      nofile: 1048576
      core: 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/-/health"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 600s  # 10 minutes for full startup
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'

networks:
  default:
    name: gitlab-enterprise-network
    driver: bridge