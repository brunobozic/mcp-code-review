apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "docker-*,gitlab-*,system-*"
    jsonData:
      interval: "Daily"
      timeField: "@timestamp"
      esVersion: "8.11.3"
      logMessageField: "message"
      logLevelField: "level"
    isDefault: false

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"